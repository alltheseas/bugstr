name: NIP-17/NIP-59 Schema Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-schemas-js:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (including @nostrability/schemata)
        working-directory: ./test-vectors
        run: npm install --include=dev

      - name: Validate NIP-17 test vectors
        working-directory: ./test-vectors
        run: node validate.js

      - name: Validate against upstream schemata (kind 14, 15, 10050, 13, 1059)
        working-directory: ./test-vectors
        run: node validate-schemata.js

  validate-schemas-rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-schema-${{ hashFiles('rust/Cargo.lock') }}

      - name: Run schema validation tests
        working-directory: ./rust
        run: cargo test --test schema_validation
