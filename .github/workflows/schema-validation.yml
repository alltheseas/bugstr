name: NIP-17/NIP-59 Schema Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-schemas:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (including @nostrability/schemata)
        working-directory: ./test-vectors
        run: npm install --include=dev

      - name: Validate NIP-17 test vectors
        working-directory: ./test-vectors
        run: node validate.js

      - name: Validate against upstream schemata (kind 14, 15, 10050, 13, 1059)
        working-directory: ./test-vectors
        run: node validate-schemata.js
